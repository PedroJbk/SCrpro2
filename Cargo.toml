[package]
name = "sdproxy"
version = "2.5.0"
edition = "2024"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
tokio-rustls = "0.24"
rustls = "0.21"
rustls-pemfile = "1.0"
once_cell = "1.19"
h2 = "0.4"
http = "1"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1"
quinn = "0.10"
rustls-native-certs = "0.6"
futures-util = "0.3"
native-tls = "0.2"
tokio-native-tls = "0.3"

[[bin]]
name = "sdproxy"
path = "src/main.rs"

[[bin]]
name = "sdproxy-xhttp"
path = "src/bin/xhttp.rs"
